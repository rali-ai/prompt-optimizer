# These maps are loaded in Nginx's http context. Only known public build
# locations may be cached; runtime configuration, API paths, query strings and
# SPA fallbacks from unknown URLs remain uncached. Use the original request URI
# so an internal redirect to index.html cannot turn an API response public.
map $request_uri $app_public_cache_control {
    default "no-store";
    # Nginx decodes escapes and resolves dot segments before selecting files.
    # Do not let a raw public prefix disguise config.js or another private path.
    # Build-generated URLs are canonical; noncanonical URLs still work online.
    ~(%|(^|/)[.][.]?(/|$)) "no-store";
    / "public, max-age=0, must-revalidate";
    /index.html "public, max-age=0, must-revalidate";
    /manifest.webmanifest "public, max-age=0, must-revalidate";
    /favicon.ico "public, max-age=0, must-revalidate";
    ~^/pwa/[^/?]+\.(png|svg|ico)$ "public, max-age=0, must-revalidate";
    ~^/assets/[^?]+$ "public, max-age=604800, no-transform";
}

# Authenticated responses and errors must never enter a shared or PWA cache.
# sw.js deliberately falls through to no-store, allowing update checks to fetch
# the current worker without relaxing the worker's public-shell-only policy.
map "$status:$http_authorization" $app_cache_control {
    default "no-store";
    ~^(200|304):$ $app_public_cache_control;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

limit_req_zone $binary_remote_addr zone=user_api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=user_api_conn:10m;
limit_req_zone $binary_remote_addr zone=mcp_api_limit:10m rate=10r/s;

server {
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 还原反向代理后的真实客户端 IP，抵御伪造前置 XFF 并避免用户折叠为内网网关 IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 安全相关头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob: https:; frame-src 'self' blob: about:; worker-src 'self' blob:; connect-src 'self' https: http://localhost:* http://127.0.0.1:* ws://localhost:* ws://127.0.0.1:*; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control $app_cache_control always;

    # 启用gzip压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript application/x-javascript image/svg+xml;
    gzip_min_length 1000;

    # 客户端缓存控制
    location ^~ /assets/ {
        # ^~ preserves this route against the static-file regex below. Retain
        # the hidden-file restriction that the outer regex would otherwise apply.
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        try_files $uri =404;
    }

    # Keep hidden files denied before considering other static extensions.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Known static file requests must not fall back to a successful HTML page.
    # Keep authentication on the document, worker, manifest and public icons.
    location ~ \.(html|js|css|png|svg|ico|woff|woff2|webmanifest)$ {
        include /etc/nginx/http.d/auth.conf;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/http.d/auth.conf;
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # MCP服务器代理（启用与站点一致的 Basic 认证，不开放通配符 CORS）
    location ^~ /mcp {
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        include /etc/nginx/http.d/auth.conf;
        access_log /dev/stdout;
        limit_req zone=mcp_api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        add_header Cache-Control "no-store" always;
    }

    location = /healthz {
        auth_basic off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 '{"ok":true}';
    }

    # 访问密码管理接口（docker/auth-api.mjs）。与页面使用同一认证，只有已登录用户可达。
    # Cache-Control: no-store 来自 server 级 $app_cache_control 的默认值。
    # 请求体大小由 auth-api 自身限制，以便超限时仍返回 JSON 错误。
    location ^~ /auth-api/ {
        include /etc/nginx/http.d/auth.conf;
        access_log /dev/stdout;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 用户账号与云同步后端（packages/user-sync-api）
    location ^~ /user-api/ {
        auth_basic off;
        access_log /dev/stdout;
        client_max_body_size 6m;
        limit_req zone=user_api_limit burst=40 nodelay;
        limit_conn user_api_conn 30;
        limit_req_status 429;
        limit_conn_status 429;

        # /user-api/admin 管理页面由后端自行输出严格的 nonce CSP、X-Frame-Options: DENY 与 nosniff。
        # 仅匹配 HTML 页面入口并设置 Vary，阻止继承 server 级安全头，避免与后端安全头重复或冲突。
        location ~ ^/user-api/admin/?$ {
            auth_basic off;
            access_log /dev/stdout;
            client_max_body_size 6m;
            limit_req zone=user_api_limit burst=40 nodelay;
            limit_conn user_api_conn 30;
            limit_req_status 429;
            limit_conn_status 429;

            add_header Vary "Cookie" always;

            proxy_pass http://127.0.0.1:3002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Docker环境状态检测（已移除，不再需要代理功能）
    # location = /api/docker-status {
    #     add_header Content-Type 'application/json';
    #     return 200 '{"status": "available", "environment": "docker"}';
    # }

    # SPA应用路由支持
    location / {
        # 引入Basic认证配置
        include /etc/nginx/http.d/auth.conf;
        
        try_files $uri $uri/ /index.html;
    }

    # 普通页面错误配置
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # 性能优化：关闭访问日志，只记录错误
    access_log off;
    error_log /var/log/nginx/error.log error;

    # 禁止特定请求方法
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 444;
    }

    # 配置较大文件的传输
    client_max_body_size 50m;
    client_body_buffer_size 128k;
    
    # 连接超时设置
    keepalive_timeout 65;
    client_header_timeout 60;
    client_body_timeout 60;
    send_timeout 60;
    proxy_connect_timeout 60;
    proxy_send_timeout 60;
    proxy_read_timeout 60;
} 
